# Daily component-skill drift check (docs/component-map.md, "Drift run").
# Copy to main firstmate's config/schedules.d/component-drift.conf, copy
# brief.md beside it as config/component-drift.brief.md, and set approval to
# who approved the schedule and when; bin/fm-schedule.sh validate refuses the
# placeholder below until then.
schema=fm-schedule/v1
name=component-drift
calendar=*-*-* 06:00:00
kind=scout
title=Component-skill drift check
brief=config/component-drift.brief.md
approval=APPROVER YYYY-MM-DD
