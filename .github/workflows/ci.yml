name: P1 checkpoint diagnostic

# Diagnostic ref only: never landing evidence or a replacement for ordinary CI.
# Paired base/head samples exercise only the unchanged fleet-ledger assertions.
on:
  push:
    branches: ['ci/diagnostic/sr-p1-checkpoint']

permissions:
  contents: read

jobs:
  diagnostic:
    name: Checkpoint counterfactual (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        mode: [control, instrumented]
    steps:
      - uses: actions/checkout@v6
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 8d3d61bfb07fd50c6045682f4c755d4fd37ea59e
          path: sample-base
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 9d6a47fa61d9411237c2c9f86beb561309b29d4e
          path: sample-head
          persist-credentials: false
      - name: Record runtime and require fixture tools
        run: |
          set -eu
          for tool in bash git jq python3 timeout tmux; do
            command -v "$tool"
          done
          bash --version
          git --version
          jq --version
          python3 --version
          timeout --version
          tmux -V
          uname -a
      - name: Paired ledger-only samples, all failures retained
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -eu
          python3 driver/.github/diagnostics/p1-checkpoint.py \
            --base "$GITHUB_WORKSPACE/sample-base" \
            --head "$GITHUB_WORKSPACE/sample-head" \
            --output "$RUNNER_TEMP/checkpoint-$MODE" --mode "$MODE"
      - name: Preserve every sample, instrumentation and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-${{ matrix.mode }}
          path: ${{ runner.temp }}/checkpoint-${{ matrix.mode }}
          if-no-files-found: error
          retention-days: 14
