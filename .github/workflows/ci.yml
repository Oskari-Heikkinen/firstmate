name: CI

on:
  push:
    branches: ['ci/sr-p0-watchdog-step-*']

permissions:
  contents: read

jobs:
  diagnostic:
    name: Startup cycle boundary and watchdog evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Counterfactual - old completion boundary must fail
        run: |
          cp tests/fm-watch-triage.test.sh "$RUNNER_TEMP/fixed-triage"
          trap 'cp "$RUNNER_TEMP/fixed-triage" tests/fm-watch-triage.test.sh' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/fm-watch-triage.test.sh')
          text = p.read_text()
          old = "      ''|*[!0-9]*|0) ;;"
          assert text.count(old) == 1
          p.write_text(text.replace(old, "      ''|*[!0-9]*) ;;"))
          PY
          set +e
          FM_TEST_ONLY=test_busy_declared_pause_is_rechecked_not_wedge_escalated \
            bash tests/fm-watch-triage.test.sh > "$RUNNER_TEMP/counterfactual.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/counterfactual.log"
          [ "$rc" -ne 0 ]
          grep -F 'poll completion accepted startup or a step beat (read 2)' "$RUNNER_TEMP/counterfactual.log"
      - name: Declared pause - fixed completion boundary
        if: always()
        run: FM_TEST_ONLY=test_busy_declared_pause_is_rechecked_not_wedge_escalated bash tests/fm-watch-triage.test.sh
      - name: Write deferral - fixed completion boundary
        if: always()
        run: FM_TEST_ONLY=test_timer_repair_drops_a_finished_write_deferral_chain bash tests/fm-watch-triage.test.sh
      - name: Watchdog step and descendant evidence
        if: always()
        run: FM_TEST_ONLY=test_watchdog_records_last_beat_and_blocking_descendants bash tests/fm-watcher-lock.test.sh
      - name: Watchdog slow failed and oversized snapshots
        if: always()
        run: FM_TEST_ONLY=test_watchdog_snapshot_is_bounded_and_cannot_delay_stop bash tests/fm-watcher-lock.test.sh
      - name: Watchdog stops a blocked live child
        if: always()
        run: FM_TEST_ONLY=test_step_blocked_on_one_live_child_is_stopped_by_watchdog bash tests/fm-watcher-lock.test.sh
      - name: Watchdog wall clock semantics
        if: always()
        run: FM_TEST_ONLY=test_watchdog_ignores_wall_clock_jump bash tests/fm-watcher-lock.test.sh
