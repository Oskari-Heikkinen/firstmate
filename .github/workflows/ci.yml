name: CI

# Diagnostic-only branches; this workflow is never part of a landing head.
on:
  push:
    branches: ['ci/sr-p0-watchdog-step-preexec-*']

permissions:
  contents: read

jobs:
  diagnostic:
    name: Pre-exec host restart - ten independent observations
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Validate workflow with pinned actionlint
        run: |
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/actionlint" .github/workflows/ci.yml
      - name: Select the unchanged failing case
        run: |
          set -eu
          command -v node
          command -v perl
          command -v jq
          command -v timeout
          test -d /proc/self/fd
          git rev-parse HEAD HEAD^
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/fm-supervision-host.test.sh')
          text = p.read_text()
          old = 'run_case_pool "${HOST_CASES[@]}" || exit 1'
          assert text.count(old) == 1
          p.write_text(text.replace(old,
              'run_case_pool test_restart_across_the_real_arm_exec_transition || exit 1'))
          PY
      - name: Observe every repetition without fail-fast or retries
        env:
          FM_SUPERVISION_HOST_CASE_JOBS: '1'
          DIAGNOSTIC_REF: ${{ github.ref_name }}
          DIAGNOSTIC_SHA: ${{ github.sha }}
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/preexec-results"
          results="$RUNNER_TEMP/preexec-results"
          printf 'branch\thead\tattempt\texit\n' > "$results/outcomes.tsv"
          failures=0
          for attempt in {1..10}; do
            printf 'PREEXEC_BEGIN branch=%s head=%s attempt=%s\n' "$DIAGNOSTIC_REF" "$DIAGNOSTIC_SHA" "$attempt"
            rc=0
            timeout --signal=TERM --kill-after=15s 150s \
              bash tests/fm-supervision-host.test.sh > "$results/attempt-$attempt.log" 2>&1 || rc=$?
            cat "$results/attempt-$attempt.log"
            if [ "$rc" -eq 0 ] && ! grep -Fxq \
              'ok - host: pre-exec recovery honors the real birth and launch token (proc/valid)' \
              "$results/attempt-$attempt.log"; then
              printf 'Observation did not execute its required assertion\n'
              rc=125
            fi
            printf '%s\t%s\t%s\t%s\n' "$DIAGNOSTIC_REF" "$DIAGNOSTIC_SHA" "$attempt" "$rc" >> "$results/outcomes.tsv"
            printf 'PREEXEC_END branch=%s head=%s attempt=%s exit=%s\n' "$DIAGNOSTIC_REF" "$DIAGNOSTIC_SHA" "$attempt" "$rc"
            [ "$rc" -eq 0 ] || failures=$((failures + 1))
          done
          cat "$results/outcomes.tsv" >> "$GITHUB_STEP_SUMMARY"
          printf 'PREEXEC_SUMMARY total=10 failed=%s\n' "$failures" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$failures" -eq 0 ]
      - name: Preserve every observation including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preexec-observations
          path: ${{ runner.temp }}/preexec-results/
          if-no-files-found: error
