name: CI

# docs/fm-test-portable-shards.md owns the tiered layout below: which tiers each
# trigger runs, how shards pack from timing artifacts, and the timeout policy.
# tests/tiers.list owns each test's tier; bin/fm-test-run.sh owns selection.
on:
  push:
    # ci/** verifies scratch work before it lands; ci/full/** runs the main
    # layout before landing.
    branches: [main, 'ci/**']
  schedule:
    # Weekly tier: Mondays 04:17 UTC.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# No concurrency block: a push run is never cancelled or replaced, which
# bin/fm-lint-workflows.sh enforces together with a timeout on every job.
# Timeout policy: docs/fm-test-portable-shards.md "Timeouts" owns the three
# tiers and their rationale; each job comment names the tier it implements.

jobs:
  plan:
    name: Plan the tiered run
    runs-on: ubuntu-latest
    # Fast tier: a changed-file listing and a few API reads.
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      layout: ${{ steps.layout.outputs.layout }}
      tiers: ${{ steps.layout.outputs.tiers }}
      shards: ${{ steps.layout.outputs.shards }}
      lint: ${{ steps.layout.outputs.lint }}
      changed: ${{ steps.layout.outputs.changed }}
      herdr_paths: ${{ steps.layout.outputs.herdr_paths }}
      baseline: ${{ steps.baseline.outputs.found }}
    steps:
      - uses: actions/checkout@v6
        with:
          # --changed diffs against origin/main.
          fetch-depth: 0
      - name: Choose the layout for this trigger
        id: layout
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -u
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          summary() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }

          # A main push whose exact commit already passed this same workflow
          # on a ci/full/** push (the main layout) skips the suites. Any doubt
          # (an API error, no matching run) runs them.
          prior_full_pass() {
            local workflow_id runs prior
            workflow_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id) \
              && [ -n "$workflow_id" ] || return 1
            runs=$(gh api "repos/$REPO/actions/workflows/$workflow_id/runs?head_sha=$HEAD_SHA&event=push&status=success&per_page=100") \
              || return 1
            prior=$(printf '%s' "$runs" | jq -r --arg sha "$HEAD_SHA" --arg repo "$REPO" \
              --argjson wid "$workflow_id" --argjson self "$RUN_ID" '
              [.workflow_runs[]?
                | select(.head_sha == $sha and .event == "push" and .conclusion == "success"
                  and .workflow_id == $wid and .id != $self
                  and (.head_branch // "" | startswith("ci/full/"))
                  and .head_repository.full_name == $repo)]
              | sort_by(.run_started_at) | last // empty
              | "\(.html_url) \(.head_branch)"') || return 1
            [ -n "$prior" ] || return 1
            summary "Suites skipped: ${prior%% *} (${prior#* }) already passed this workflow on \`$HEAD_SHA\`."
          }

          layout=full
          case "$EVENT" in
            schedule|workflow_dispatch) layout=weekly ;;
            push)
              case "$REF" in
                refs/heads/main) prior_full_pass && layout=skip ;;
                refs/heads/ci/full/*) layout=full ;;
                refs/heads/ci/*) layout=ci ;;
              esac
              ;;
          esac

          changed=false
          herdr_paths=
          if [ "$layout" = ci ]; then
            # Tier-2 and weekly tests mapped to the changed files. An unmapped
            # path, or a widely sourced change selecting more than 30 tests,
            # escalates the push to the main layout.
            herdr_family=$(bin/fm-test-run.sh --list --family real-herdr-gated) || exit 1
            if ! selected=$(bin/fm-test-run.sh --list --changed --base origin/main --tier full,weekly); then
              summary "Changed files include a path the test map cannot place: running the main layout."
              layout=full
            elif [ "$(printf '%s\n' "$selected" | grep -c .)" -gt 30 ]; then
              summary "Changed files select more than 30 tier-2 tests: running the main layout."
              layout=full
            else
              portable=$(printf '%s\n' "$selected" | grep -vxF -e "$herdr_family" | grep . || true)
              [ -z "$portable" ] || changed=true
              herdr_gate=$(bin/fm-test-run.sh --list --family real-herdr-gated --tier gate) || exit 1
              herdr_paths=$( { printf '%s\n' "$herdr_gate"; printf '%s\n' "$selected" | grep -xF -e "$herdr_family" || true; } \
                | grep . | LC_ALL=C sort -u | tr '\n' ' ')
              summary "Changed-area tier-2 tests: $(printf '%s\n' "$selected" | grep -c .)"
            fi
          fi

          case "$layout" in
            skip) tiers=; shards='[]' ;;
            ci) tiers=gate; shards='[1,2,3]' ;;
            full) tiers=gate,full; shards='[1,2,3,4,5,6,7]' ;;
            weekly) tiers=weekly,live; shards='[1,2,3,4,5]' ;;
          esac
          # Lint scopes: the changed files on every ci/** push, all of bin/ in
          # three partitions on the main layout; the weekly test-lint job
          # covers every test file.
          lint='[]'
          case "$layout:$REF" in
            ci:*) lint='["changed"]' ;;
            full:refs/heads/main) lint='["1of3","2of3","3of3"]' ;;
            full:*) lint='["changed","1of3","2of3","3of3"]' ;;
          esac
          summary "Layout: $layout (event $EVENT, ref $REF)"
          out layout "$layout"
          out tiers "$tiers"
          out shards "$shards"
          out lint "$lint"
          out changed "$changed"
          out herdr_paths "$herdr_paths"
      # Shards pack by measured durations: the aggregate timing artifact of the
      # newest successful main or ci/full/** run, merged with the newest
      # successful weekly run's. Without one every test weighs the same.
      - name: Fetch the baseline timing
        id: baseline
        if: steps.layout.outputs.layout != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -u
          none() {
            echo "$1: shards weigh every test the same"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          workflow_id=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .workflow_id) \
            && [ -n "$workflow_id" ] || none "could not read this run's workflow"
          runs=$(gh api "repos/$REPO/actions/workflows/$workflow_id/runs?status=success&per_page=100") \
            || none "could not list successful runs"
          dir="$RUNNER_TEMP/fm-timing-runs"
          for group in suite weekly; do
            ids=$(printf '%s' "$runs" | jq -r --arg g "$group" --arg repo "$REPO" '
              .workflow_runs[]?
              | select(.head_repository.full_name == $repo)
              | select(if $g == "suite"
                  then .event == "push" and ((.head_branch // "") as $b | $b == "main" or ($b | startswith("ci/full/")))
                  else .event == "schedule" or .event == "workflow_dispatch" end)
              | .id' | head -n 10) || continue
            for id in $ids; do
              # Main runs that skipped their suites carry no aggregate.
              if gh run download "$id" -R "$REPO" -n fm-test-timing-aggregate -D "$dir/$group" >/dev/null 2>&1 \
                && [ -s "$dir/$group/fm-test-timing-aggregate.json" ]; then
                echo "baseline $group timing: run $id"
                break
              fi
              rm -rf "${dir:?}/$group"
            done
          done
          shopt -s nullglob
          inputs=("$dir"/*/fm-test-timing-aggregate.json)
          [ "${#inputs[@]}" -gt 0 ] || none "no successful run kept an aggregate timing artifact"
          mkdir -p "$RUNNER_TEMP/fm-timing"
          bin/fm-test-run.sh --aggregate-json "$RUNNER_TEMP/fm-timing/fm-timing-baseline.json" "${inputs[@]}" \
            || none "could not merge the baseline timing"
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Upload the baseline timing
        if: steps.baseline.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Deliberately outside the fm-test-timing-* pattern the aggregate reads.
          name: fm-timing-baseline
          path: ${{ runner.temp }}/fm-timing/fm-timing-baseline.json

  # Tier 0 on every run: the tier-map coverage guard, the safety guards
  # (bin/fm-safety-guard.sh owns their rules), the static-tier tests, and the
  # repository invariants.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    # Fast tier: seconds-long local checks.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit guard reads every pushed commit and the merge base.
          fetch-depth: 0
      - name: Every test has exactly one tier
        run: bin/fm-test-run.sh --check-coverage
      - name: Safety-core tests present and selected by the gate tier
        run: bin/fm-safety-guard.sh core
      - name: Pushed commits keep risky-area tests and the safety core
        if: github.event_name == 'push'
        env:
          GUARD_BEFORE: ${{ github.event.before }}
          GUARD_HEAD: ${{ github.sha }}
        run: bin/fm-safety-guard.sh commits --before "$GUARD_BEFORE" --head "$GUARD_HEAD"
      - name: Pushed risky-area commits carry a lean-review receipt
        if: github.event_name == 'push'
        env:
          GUARD_BEFORE: ${{ github.event.before }}
          GUARD_HEAD: ${{ github.sha }}
        run: bin/fm-safety-guard.sh receipts --before "$GUARD_BEFORE" --head "$GUARD_HEAD"
      - name: Compatibility pointers must stay intact
        run: |
          set -eu
          [ ! -L CLAUDE.md ] || { echo "::error::CLAUDE.md must be a real @AGENTS.md pointer file, not a symlink"; exit 1; }
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          printf '%s\n' '@AGENTS.md' >"$tmp"
          cmp -s CLAUDE.md "$tmp" || { echo "::error::CLAUDE.md must be the canonical @AGENTS.md pointer"; exit 1; }
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal fleet paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects .no-mistakes)
          if [ -n "$tracked" ]; then
            echo "::error::Personal fleet paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
      - name: Run the static tier
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          bin/fm-test-run.sh --tier static \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-static.json"
      - name: Upload static timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-static
          path: ${{ runner.temp }}/fm-test/fm-test-timing-static.json
          if-no-files-found: warn

  lint:
    name: Lint ${{ matrix.scope }}
    needs: plan
    if: needs.plan.outputs.layout == 'ci' || needs.plan.outputs.layout == 'full'
    runs-on: ubuntu-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scope: ${{ fromJSON(needs.plan.outputs.lint) }}
    steps:
      - uses: actions/checkout@v6
        with:
          # --changed diffs against origin/main.
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Single owner of the lint definition (shell file set, config, version,
      # and GitHub workflow lint). Do not re-spell the checks here; keep CI
      # and the pre-push gate on this script so a self-broken ci.yml still
      # fails locally before merge.
      - name: Lint ${{ matrix.scope }}
        env:
          # Fail closed rather than lint uncapped when a configured per-root
          # bound (wall deadline or memory rlimit) cannot be enforced here.
          FM_LINT_REQUIRE_BOUNDS: '1'
          # Two workers: heavy roots share one worker, so the 16 GiB runner
          # holds at most one heavy analysis plus one light one at a time.
          FM_LINT_JOBS: '2'
          # The merged source closures outgrow the default 12 GiB virtual
          # cap (~8 GiB GHC heap). This is address space, not resident memory;
          # keep heavy roots serialized and retain full source/dataflow lint.
          FM_LINT_ROOT_MEMORY_KIB: '16777216'
          SCOPE: ${{ matrix.scope }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-lint"
          case "$SCOPE" in
            changed) scope_args=(--changed) ;;
            *) scope_args=(--partition "$SCOPE") ;;
          esac
          bin/fm-lint.sh "${scope_args[@]}" --telemetry "$RUNNER_TEMP/fm-lint/lint-$SCOPE.tsv"
      - name: Upload lint telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-lint-telemetry-${{ matrix.scope }}
          path: |
            ${{ runner.temp }}/fm-lint/lint-${{ matrix.scope }}.tsv
            ${{ runner.temp }}/fm-lint/lint-${{ matrix.scope }}.roots.tsv
          if-no-files-found: warn

  # The plan's tiers, packed into duration-balanced shards by bin/fm-test-run.sh
  # --shard. Real Herdr stays in tests-herdr.
  tests:
    name: Behavior shard ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.layout != 'skip'
    runs-on: ubuntu-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    strategy:
      # Every shard reports so one failure never hides another shard's result.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require tmux for e2e tests
        run: |
          set -eu
          command -v tmux >/dev/null || {
            echo "::error::tmux is required for real afk injection e2e coverage"
            exit 1
          }
          tmux -V
      # tests/fm-pack.test.sh packs and reads real SquashFS images; without
      # these tools it skips. Its mount case also skips where FUSE cannot mount.
      - name: Install SquashFS tools for the pack tests
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y squashfs-tools squashfuse
          mksquashfs -version | head -n1
      - name: Install tasks-axi for backlog-handoff delegation
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      # The Pi extension tests read the installed Pi package's own types and
      # runtime, so without it they gate-skip and pass silently. It is a public
      # npm package and needs no credential, so CI can hold the real thing.
      # Pinned to the last known-good Pi: 0.99.1 breaks the Calm export and
      # outcome-rendering tests (kunchenguid/firstmate issue 6220); lift the
      # pin once the extension and tests support the newer release.
      - name: Install the Pi package for the Pi extension tests
        run: |
          set -eu
          npm install -g @earendil-works/pi-coding-agent@0.87.1
          npm ls -g --depth 0 @earendil-works/pi-coding-agent
      - name: Download the baseline timing
        if: needs.plan.outputs.baseline == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fm-timing-baseline
          path: ${{ runner.temp }}/fm-timing
      - name: Run shard ${{ matrix.shard }}
        env:
          TIERS: ${{ needs.plan.outputs.tiers }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          SHARD_NUMBER: ${{ matrix.shard }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          timing=()
          baseline="$RUNNER_TEMP/fm-timing/fm-timing-baseline.json"
          [ ! -s "$baseline" ] || timing=(--timing "$baseline")
          # The Pi package is installed above and CI provides npm and tsc, so
          # any missing typecheck prerequisite is a broken shard, not a valid skip.
          bin/fm-test-run.sh --tier "$TIERS" --exclude-family real-herdr-gated \
            --shard "$SHARD" --jobs 4 ${timing[@]+"${timing[@]}"} \
            --fail-on-gate-skip 'Pi extension typecheck prerequisite not found' \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-tests-${SHARD_NUMBER}.json"
      - name: Upload shard ${{ matrix.shard }} timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/fm-test/fm-test-timing-tests-${{ matrix.shard }}.json
          if-no-files-found: warn

  # On a ci/** push: the tier-2 and weekly tests mapped to the changed files.
  tests-changed:
    name: Behavior changed area
    needs: plan
    if: needs.plan.outputs.layout == 'ci' && needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require tmux for e2e tests
        run: |
          set -eu
          command -v tmux >/dev/null || {
            echo "::error::tmux is required for real afk injection e2e coverage"
            exit 1
          }
          tmux -V
      - name: Install tasks-axi for backlog-handoff delegation
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      # Same pin and reason as the tests job above.
      - name: Install the Pi package for the Pi extension tests
        run: |
          set -eu
          npm install -g @earendil-works/pi-coding-agent@0.87.1
          npm ls -g --depth 0 @earendil-works/pi-coding-agent
      - name: Run the changed-area tests
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          bin/fm-test-run.sh --changed --base origin/main --tier full,weekly \
            --exclude-family real-herdr-gated --jobs 4 \
            --fail-on-gate-skip 'Pi extension typecheck prerequisite not found' \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-changed.json"
      - name: Upload changed-area timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-changed
          path: ${{ runner.temp }}/fm-test/fm-test-timing-changed.json
          if-no-files-found: warn

  # On a ci/** push that changes a risky-area script: a few mutants on the
  # changed lines, each run against the script's gate-tier tests
  # (bin/fm-mutate.sh changed). A report beside the lean review, never a
  # gate: survivors only show in the summary, and the job cannot fail the run.
  # A risky-script change often selects enough tests to escalate the push to
  # the main layout, so the job keys on the ci/** ref, not on the layout.
  mutation-changed:
    name: Mutation check on changed risky lines
    needs: plan
    if: >-
      startsWith(github.ref, 'refs/heads/ci/') &&
      (needs.plan.outputs.layout == 'ci' || needs.plan.outputs.layout == 'full')
    runs-on: ubuntu-latest
    continue-on-error: true
    # Normal tier (see the timeout policy above); the check spends at most
    # 15 minutes on mutants.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Find changed risky-area scripts
        id: scope
        run: |
          set -eu
          base=$(git merge-base origin/main HEAD)
          scripts=$(bin/fm-mutate.sh changed --base "$base" --scripts-only)
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"
          if [ -n "$scripts" ]; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
            printf 'Changed risky-area scripts:\n%s\n' "$scripts"
          else
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            echo "No risky-area script changed; nothing to mutate."
          fi
      - name: Install the test tools the tests job installs
        if: steps.scope.outputs.changed == 'true'
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          npm install -g tasks-axi
          npm install -g @earendil-works/pi-coding-agent@0.87.1
      - name: Mutate the changed lines
        if: steps.scope.outputs.changed == 'true'
        env:
          BASE: ${{ steps.scope.outputs.base }}
        run: |
          set -u
          bin/fm-mutate.sh changed --base "$BASE" --max 20 --budget-secs 900 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

  # Required real-Herdr job: pinned install, the real-herdr-gated family run
  # serially, hard-fail on "skip: herdr not found". The main layout runs its
  # gate and tier-2 members; a ci/** push runs the gate members plus those
  # mapped to the changed files. Starts on Linux x86_64; if a genuine platform
  # invariant fails (focus, cleanup, default-session tripwire), keep the
  # failure evidence and move the job to macOS rather than skip assertions.
  tests-herdr:
    name: Behavior tests (Herdr)
    needs: plan
    if: needs.plan.outputs.layout == 'ci' || needs.plan.outputs.layout == 'full'
    runs-on: ubuntu-latest
    # Heavy tier (see the timeout policy above): the last-resort job backstop.
    # The family-run step below owns the hang tripwire, so a wedged suite fails
    # there with the always() cleanup and timing upload still running.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require tools for real Herdr
        run: |
          set -eu
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }
          command -v python3 >/dev/null || { echo "::error::python3 is required"; exit 1; }
          command -v curl >/dev/null || { echo "::error::curl is required"; exit 1; }
          command -v tar >/dev/null || { echo "::error::tar is required"; exit 1; }
          jq --version
          python3 --version
      - name: Install pinned Herdr
        run: |
          set -eu
          bin/fm-install-herdr.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned Treehouse
        run: |
          set -eu
          # Several real-herdr-gated E2E scripts require treehouse for spawn
          # worktree acquisition (presentation, workspace-per-home, autodetect).
          bin/fm-install-treehouse.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Assert Herdr pin and protocol floor
        run: |
          set -eu
          command -v herdr >/dev/null || { echo "::error::herdr not on PATH after install"; exit 1; }
          command -v treehouse >/dev/null || { echo "::error::treehouse not on PATH after install"; exit 1; }
          herdr --version
          treehouse --version
          status=$(herdr status --json)
          printf '%s\n' "$status"
          version=$(printf '%s' "$status" | jq -r '.client.version // empty')
          protocol=$(printf '%s' "$status" | jq -r '.client.protocol // empty')
          [ "$version" = "0.7.4" ] || {
            echo "::error::expected exact Herdr pin 0.7.4, got ${version:-<empty>}"
            exit 1
          }
          case "$protocol" in
            ''|*[!0-9]*) echo "::error::could not read client protocol"; exit 1 ;;
          esac
          [ "$protocol" -ge 16 ] || {
            echo "::error::herdr protocol $protocol is below the required floor 16"
            exit 1
          }
      - name: Start default Herdr session for fleet-state tripwire
        run: |
          set -eu
          # Lab provision requires exactly one running default session so the
          # default-session tripwire can arm. Start it headless; never use it
          # for lab work (tests still refuse default and use fm-lab-* only).
          mkdir -p "$RUNNER_TEMP/fm-herdr"
          nohup herdr server >"$RUNNER_TEMP/fm-herdr/default-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/fm-herdr/default-server.pid"
          attempt=0
          while [ "$attempt" -lt 150 ]; do
            running=$(herdr status --json 2>/dev/null | jq -r '.server.running // false' || echo false)
            if [ "$running" = true ]; then
              herdr session list --json | jq -e '
                [.sessions[]? | select(.default == true and .name == "default" and .running == true)]
                | length == 1
              ' >/dev/null
              echo "default Herdr session is running"
              exit 0
            fi
            sleep 0.2
            attempt=$((attempt + 1))
          done
          echo "::error::default Herdr server did not become ready"
          cat "$RUNNER_TEMP/fm-herdr/default-server.log" || true
          exit 1
      - name: Snapshot pre-suite Herdr sessions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-herdr"
          bin/fm-herdr-ci-cleanup.sh snapshot "$RUNNER_TEMP/fm-herdr/sessions-before.json"
      - name: Run real-Herdr family (serial, required)
        id: run-real-herdr-family
        # Heavy tier step tripwire: above the healthy family wall and far
        # below the job backstop, so a hang fails this step and cleanup runs.
        timeout-minutes: 20
        env:
          LAYOUT: ${{ needs.plan.outputs.layout }}
          HERDR_PATHS: ${{ needs.plan.outputs.herdr_paths }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          if [ "$LAYOUT" = full ]; then
            selection=(--family real-herdr-gated --tier 'gate,full')
          else
            # Paths the plan job listed: the gate members and the changed area.
            read -r -a selection <<<"$HERDR_PATHS"
            selection=(--tier 'gate,full,weekly' "${selection[@]}")
          fi
          # Serial only. Fail if any script reports herdr not found. Live
          # harness credential tests stay outside this job (opt-in env only).
          bin/fm-test-run.sh "${selection[@]}" --jobs 1 \
            --fail-on-gate-skip 'herdr not found' \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-herdr.json"
      - name: Cleanup job-owned Herdr lab sessions
        id: cleanup-herdr-lab-sessions
        if: always()
        run: |
          set -eu
          bin/fm-herdr-ci-cleanup.sh teardown "$RUNNER_TEMP/fm-herdr/sessions-before.json" || {
            echo "::warning::lab session cleanup reported a problem; see logs"
            # Surface diagnostics without weakening the suite result above.
            herdr session list --json || true
            exit 1
          }
      - name: Upload Herdr timing and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-herdr
          path: |
            ${{ runner.temp }}/fm-test/fm-test-timing-herdr.json
            ${{ runner.temp }}/fm-herdr/sessions-before.json
            ${{ runner.temp }}/fm-herdr/default-server.log
          if-no-files-found: warn

  # Aggregate per-job timing into the artifact later runs pack their shards by.
  tests-timing-aggregate:
    name: Behavior timing aggregate
    runs-on: ubuntu-latest
    # Fast tier: aggregation is seconds of work over job artifacts.
    timeout-minutes: 5
    needs:
      - plan
      - static
      - tests
      - tests-changed
      - tests-herdr
    if: always() && needs.plan.outputs.layout != 'skip' && needs.plan.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - name: Download job timing artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fm-test-timing-*
          path: ${{ runner.temp }}/fm-test-aggregate
          merge-multiple: true
      - name: Build aggregate timing summary
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          shopt -s nullglob
          # A job uploading more than one path keeps its fm-test/ folder in
          # the artifact (the Herdr job does), so read one level down too.
          inputs=("$RUNNER_TEMP"/fm-test-aggregate/fm-test-timing-*.json
            "$RUNNER_TEMP"/fm-test-aggregate/*/fm-test-timing-*.json)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::warning::no per-job timing JSON found to aggregate"
            exit 0
          fi
          bin/fm-test-run.sh --aggregate-json \
            "$RUNNER_TEMP/fm-test/fm-test-timing-aggregate.json" \
            "${inputs[@]}"
      - name: Upload aggregate timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-aggregate
          path: ${{ runner.temp }}/fm-test/fm-test-timing-aggregate.json
          if-no-files-found: warn

  macos-stock-bash:
    name: Stock macOS Bash snapshot compatibility
    needs: plan
    if: needs.plan.outputs.layout == 'weekly'
    runs-on: macos-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run snapshot consumers with stock Bash
        shell: /bin/bash {0}
        env:
          PATH: /bin:/usr/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin
        run: |
          set -eu
          case "$BASH_VERSION" in
            3.2.57*) ;;
            *) echo "::error::expected stock macOS Bash 3.2.57, got $BASH_VERSION"; exit 1 ;;
          esac
          /bin/bash --version | head -1
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }

          shell_inventory="$RUNNER_TEMP/fm-shell-inventory"
          bin/fm-lint.sh --list-files > "$shell_inventory"
          printf '%s\n' tests/*.sh >> "$shell_inventory"
          parse_fail=0
          while IFS= read -r f; do
            /bin/bash -n "$f" || { echo "::error::stock macOS Bash 3.2 failed to parse $f"; parse_fail=1; }
          done < "$shell_inventory"
          [ "$parse_fail" -eq 0 ] || { echo "::error::stock macOS Bash 3.2 parse sweep failed"; exit 1; }

          command -v npm >/dev/null || { echo "::error::npm is required to install tasks-axi"; exit 1; }
          npm install -g tasks-axi@0.2.6 >/dev/null
          PATH="$(npm prefix -g)/bin:$PATH"
          export PATH
          command -v tasks-axi >/dev/null || { echo "::error::tasks-axi is required for the stock Bash regressions"; exit 1; }

          snapshot_output=$(/bin/bash tests/fm-fleet-snapshot-view.test.sh)
          printf '%s\n' "$snapshot_output"
          snapshot_count=$(printf '%s\n' "$snapshot_output" | grep -c '^ok - ')
          [ "$snapshot_count" -eq 18 ] || {
            echo "::error::expected 18 snapshot/fleet-view tests, got $snapshot_count"
            exit 1
          }

          bearings_output=$(/bin/bash tests/fm-bearings-snapshot.test.sh)
          printf '%s\n' "$bearings_output"
          bearings_count=$(printf '%s\n' "$bearings_output" | grep -c '^ok - ')
          [ "$bearings_count" -eq 60 ] || {
            echo "::error::expected 60 Bearings tests, got $bearings_count"
            exit 1
          }

          # The full public-followup suite is not a stock-bash snapshot; run only
          # the empty-lock register regression under real /bin/bash 3.2.
          pf_output=$(FM_TEST_ONLY=test_first_register_succeeds_with_empty_lock_list_under_bash32 \
            /bin/bash tests/fm-public-followup.test.sh)
          printf '%s\n' "$pf_output"
          pf_count=$(printf '%s\n' "$pf_output" | grep -c '^ok - ')
          [ "$pf_count" -eq 1 ] || {
            echo "::error::expected 1 public-followup bash 3.2 register regression, got $pf_count"
            exit 1
          }

          # Same shape for the watcher's churn-deferral regression: an already-
          # marked churn window expands an empty array that only stock Bash
          # treats as an unbound variable under set -u.
          churn_output=$(FM_TEST_ONLY=test_turn_ended_churn_existing_marker_absorbed \
            /bin/bash tests/fm-watch-triage.test.sh)
          printf '%s\n' "$churn_output"
          churn_count=$(printf '%s\n' "$churn_output" | grep -c '^ok - ')
          [ "$churn_count" -eq 1 ] || {
            echo "::error::expected 1 watcher churn-deferral bash 3.2 regression, got $churn_count"
            exit 1
          }

          # The fork-free hot-path helpers must stay byte-identical to the
          # commands they replace under stock Bash 3.2, which lacks the
          # printf %(...)T clock and falls back to date, cat and od.
          helpers_output=$(/bin/bash tests/fm-fork-free-helpers.test.sh)
          printf '%s\n' "$helpers_output"
          helpers_count=$(printf '%s\n' "$helpers_output" | grep -c '^ok - ')
          [ "$helpers_count" -eq 9 ] || {
            echo "::error::expected 9 fork-free helper bash 3.2 regressions, got $helpers_count"
            exit 1
          }

          backend_output=$(FM_TEST_ONLY=test_backend_source_requires_adapter_file \
            FM_TEST_BASH=/bin/bash \
            /bin/bash tests/fm-backend.test.sh)
          printf '%s\n' "$backend_output"
          backend_count=$(printf '%s\n' "$backend_output" | grep -c '^ok - ')
          [ "$backend_count" -eq 2 ] || {
            echo "::error::expected 2 backend adapter-file bash 3.2 regressions, got $backend_count"
            exit 1
          }

  # Weekly full lint of every test file; per-push lint covers only changed ones.
  test-lint:
    name: Test-file lint
    needs: plan
    if: needs.plan.outputs.layout == 'weekly'
    runs-on: ubuntu-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint every test file
        env:
          # Same bounds and reasons as the lint job above.
          FM_LINT_REQUIRE_BOUNDS: '1'
          FM_LINT_JOBS: '2'
          FM_LINT_ROOT_MEMORY_KIB: '16777216'
        run: |
          set -eu
          bin/fm-lint.sh tests/*.sh

  # A red weekly run opens, or comments on, one tracking issue so it reaches
  # someone instead of sitting in the Actions tab.
  weekly-alert:
    name: Report a red weekly run
    needs:
      - plan
      - static
      - tests
      - tests-timing-aggregate
      - macos-stock-bash
      - test-lint
    if: >-
      always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    # Fast tier: two API calls.
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the weekly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          title='Weekly CI run failed'
          body="The weekly CI run failed: $RUN_URL"
          printf '## %s\n\n%s\n' "$title" "$body" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(gh api "repos/$REPO" --jq .has_issues)" != true ]; then
            # Issues are off: stay red so the run and GitHub's failed-run
            # notification still carry the alert.
            echo "::error title=$title::$body (repository issues are disabled, so no issue was opened)"
            exit 1
          fi
          number=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" \
            --json number,title --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$REPO" --body "$body"
          else
            gh issue create -R "$REPO" --title "$title" --body "$body"
          fi
