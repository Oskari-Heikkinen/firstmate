name: Supervision calibration

on:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:
    inputs:
      plan:
        description: 'Reviewed tracked ci/supervision-plans/NAME.json (empty selects synthetic fixtures)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  calibrate:
    name: Sealed per-tick fixture costs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install CI-only tracing tools
        run: sudo apt-get update && sudo apt-get install -y strace time jq
      - name: Build isolated fixture plan
        env:
          REVIEWED_PLAN: ${{ inputs.plan }}
        run: |
          args=()
          if [ -n "$REVIEWED_PLAN" ]; then args+=("$REVIEWED_PLAN"); fi
          python3 tests/fixtures/supervision-accounting/calibration.py \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/calibration-homes" "$RUNNER_TEMP/plan.json" "${args[@]}"
      - name: Measure exact-head fixture ticks
        run: >-
          python3 bin/fm-supervision-accounting.py calibrate-ci "$RUNNER_TEMP/plan.json"
          --output "$RUNNER_TEMP/calibration" --repeats 3
      - name: Retain sealed calibration and refusal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervision-calibration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/calibration
            ${{ runner.temp }}/plan.json
            ${{ runner.temp }}/calibration-homes/write-probe.trace
          if-no-files-found: error

  # The Darwin runner queue is scarce, so a ci/** push runs native-stat only
  # when it changes the watcher graph that test covers; main and manual runs
  # always run it. bin/fm-ci-job-scope.sh owns the scope rules; an unknown
  # answer runs the job with a warning rather than skipping it.
  native-stat-scope:
    name: Native summary stat scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The scope diffs against origin/main.
          fetch-depth: 0
      - name: Decide whether this push changes the Darwin test's scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -u
          if [ "$EVENT" = push ]; then
            decision=$(bin/fm-ci-job-scope.sh --ref "$REF" --base origin/main \
              .github/workflows/supervision-calibration.yml bin/fm-ci-job-scope.sh \
              tests/fm-watch-triage.test.sh bin/fm-watch*.sh) \
              || decision="unknown: bin/fm-ci-job-scope.sh exited $?"
          else
            decision="run: a $EVENT event always runs it"
          fi
          printf 'Darwin native-stat %s\n' "$decision" >> "$GITHUB_STEP_SUMMARY"
          case "$decision" in
            skip:*) run=false ;;
            run:*) run=true ;;
            *) run=true; printf '::warning title=Darwin scope unknown::%s\n' "$decision" ;;
          esac
          printf 'run=%s\n' "$run" >> "$GITHUB_OUTPUT"

  native-stat:
    name: Native summary stat (Darwin)
    needs: native-stat-scope
    # Only an explicit skip skips: a scope job that failed or never ran
    # leaves the output empty, and the Darwin check still runs.
    if: ${{ !cancelled() && needs.native-stat-scope.outputs.run != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check native BSD stat with stock Bash
        env:
          FM_TEST_ONLY: test_tick_summary_stat_is_portable
        run: /bin/bash tests/fm-watch-triage.test.sh
